name: Build and Push Docker Image to Docker Hub

# Trigger workflow on push to week02 branch
on:
  push:
    branches:
      - week02

# Define environment variables
env:
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/cs6620-flask-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Step 2: Set up Docker Buildx for advanced build features
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      # Step 3: Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      # Step 4: Extract metadata for Docker images
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # Always update the 'latest' tag
            type=raw,value=latest
            # Tag with the commit SHA (short version)
            type=sha,prefix={{sha}},format=short
            # Tag with the commit SHA (full version)
            type=sha,prefix={{sha}},format=long
            # Tag with timestamp
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}
            # Tag with branch name
            type=ref,event=branch
      
      # Step 5: Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}
            build.source=github-actions
            build.workflow=${{ github.workflow }}
            build.run_id=${{ github.run_id }}
            build.run_number=${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      # Step 6: Output image details
      - name: Image digest
        run: |
          echo "Image pushed to Docker Hub successfully!"
          echo "Image tags:"
          echo "${{ steps.meta.outputs.tags }}"
          echo "---"
          echo "Image labels:"
          echo "${{ steps.meta.outputs.labels }}"

  # NEW DEPLOYMENT JOB STARTS HERE
  deploy:
    needs: build-and-push  # Only run after build-and-push job succeeds
    runs-on: ubuntu-latest
    if: success()  # Only deploy if build was successful
    
    steps:
      # Step 1: Configure AWS credentials for deployment
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      # Step 2: Deploy to EC2 using SSM
      - name: Deploy to EC2 via SSM
        id: deploy
        run: |
          echo "🚀 Starting deployment to EC2 instance..."
          
          # Send deployment commands to EC2 via SSM
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "GitHub Actions Deployment - Run #${{ github.run_number }} - Commit: ${{ github.sha }}" \
            --timeout-seconds 300 \
            --parameters 'commands=[
              "echo \"=== Starting Docker deployment ===\"",
              "echo \"Timestamp: $(date)\"",
              "echo \"Pulling latest image from Docker Hub...\"",
              "docker pull ${{ env.IMAGE_NAME }}:latest",
              "echo \"Stopping existing container (if any)...\"",
              "docker stop flask-app 2>/dev/null || true",
              "echo \"Removing old container (if any)...\"",
              "docker rm flask-app 2>/dev/null || true",
              "echo \"Starting new container...\"",
              "docker run -d --name flask-app --restart unless-stopped -p 80:5000 ${{ env.IMAGE_NAME }}:latest",
              "echo \"Verifying container is running...\"",
              "docker ps | grep flask-app",
              "echo \"=== Deployment complete ===\""
            ]' \
            --output text \
            --query 'Command.CommandId')
          
          echo "Command ID: $COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> $GITHUB_OUTPUT
          
          # Wait for the command to complete (timeout after 5 minutes)
          echo "⏳ Waiting for deployment to complete..."
          
          if aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            2>/dev/null; then
            echo "✅ Command executed successfully"
          else
            echo "⚠️ Wait command timed out or failed, checking status manually..."
          fi
      
      # Step 3: Check deployment status and get output
      - name: Check deployment status
        if: always()  # Run even if previous step fails
        run: |
          COMMAND_ID="${{ steps.deploy.outputs.command_id }}"
          
          if [ -z "$COMMAND_ID" ]; then
            echo "❌ No command ID found, deployment may have failed to start"
            exit 1
          fi
          
          # Get command invocation details
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query 'Status' \
            --output text)
          
          echo "Deployment Status: $STATUS"
          
          # Get command output
          echo "=== Deployment Output ==="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query 'StandardOutputContent' \
            --output text
          
          # If command failed, show error output
          if [ "$STATUS" != "Success" ]; then
            echo "=== Error Output ==="
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query 'StandardErrorContent' \
              --output text
            
            echo "❌ Deployment failed with status: $STATUS"
            exit 1
          fi
          
          echo "✅ Deployment completed successfully!"
      
      # Step 4: Display application URL
      - name: Display application URL
        if: success()
        run: |
          # Get the public IP of the EC2 instance
          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)
          
          echo "🎉 Deployment successful!"
          echo "📍 Application URL: http://$PUBLIC_IP"
          echo "📝 Note: Make sure port 80 is open in your EC2 security group"
          echo ""
          echo "To verify deployment:"
          echo "  curl http://$PUBLIC_IP"