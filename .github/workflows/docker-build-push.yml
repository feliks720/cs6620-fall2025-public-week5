name: Build and Push Docker Image to Docker Hub

# Trigger workflow on push to week02 branch
on:
  push:
    branches:
      - week02

# Define environment variables
env:
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
  IMAGE_NAME: ${{ secrets.DOCKER_HUB_USERNAME }}/cs6620-flask-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Step 2: Set up Docker Buildx for advanced build features
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      # Step 3: Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      
      # Step 4: Extract metadata for Docker images
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # Always update the 'latest' tag
            type=raw,value=latest
            # Tag with the commit SHA (short version)
            type=sha,prefix={{sha}},format=short
            # Tag with the commit SHA (full version)
            type=sha,prefix={{sha}},format=long
            # Tag with timestamp
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}
            # Tag with branch name
            type=ref,event=branch
      
      # Step 5: Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}
            build.source=github-actions
            build.workflow=${{ github.workflow }}
            build.run_id=${{ github.run_id }}
            build.run_number=${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      # Step 6: Output image details
      - name: Image digest
        run: |
          echo "Image pushed to Docker Hub successfully!"
          echo "Image tags:"
          echo "${{ steps.meta.outputs.tags }}"
          echo "---"
          echo "Image labels:"
          echo "${{ steps.meta.outputs.labels }}"